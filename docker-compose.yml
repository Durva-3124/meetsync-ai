version: "3.9"

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/meetsync
      REDIS_URL: redis://redis:6379
      AI_SERVICE_1_URL: http://ai-1:8001
      AI_SERVICE_2_URL: http://ai-2:8002
      AI_USE_MOCKS: "false"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-1:
    build:
      context: ./ai-service
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
      PYTHONUNBUFFERED: "1"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-2:
    build:
      context: ./ai-service
    ports:
      - "8002:8002"
    environment:
      PORT: "8002"
      PYTHONUNBUFFERED: "1"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  redis_data: